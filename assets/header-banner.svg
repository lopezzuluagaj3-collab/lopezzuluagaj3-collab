<svg width="100%" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo Espacial Profundo -->
    <linearGradient id="deep-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05000c" />
      <stop offset="25%" stop-color="#0b001a" />
      <stop offset="50%" stop-color="#190333" />
      <stop offset="75%" stop-color="#0e0024" />
      <stop offset="100%" stop-color="#04000a" />
    </linearGradient>

    <!-- Resplandor de Nebulosa Morada Eléctrica -->
    <radialGradient id="nebula-center" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#4c1d95" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula-left" cx="20%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6b21a8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula-right" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#581c87" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Resplandor del Planeta -->
    <radialGradient id="planet-glow" cx="85%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#2e1065" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050014" stop-opacity="1" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradiente de Línea Láser Neón -->
    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="20%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente para Tipografía Principal -->
    <linearGradient id="headline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <linearGradient id="sub-headline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- 1. FONDO ESPACIAL -->
  <rect width="1200" height="240" rx="14" fill="url(#deep-space)" />

  <!-- 2. NUBES DE NEBULOSA CÓSMICA -->
  <rect width="1200" height="240" rx="14" fill="url(#nebula-center)" />
  <rect width="1200" height="240" rx="14" fill="url(#nebula-left)" />
  <rect width="1200" height="240" rx="14" fill="url(#nebula-right)" />

  <!-- 3. PLANETAS EN LOS BORDES (ATMÓSFERA CÓSMICA) -->
  <!-- Planeta Izquierdo Parcial -->
  <circle cx="20" cy="180" r="130" fill="url(#planet-glow)" opacity="0.65" />
  <circle cx="20" cy="180" r="131" stroke="#a855f7" stroke-width="1.5" opacity="0.4" fill="none" />

  <!-- Planeta Derecho Parcial -->
  <circle cx="1180" cy="60" r="105" fill="url(#planet-glow)" opacity="0.75" />
  <circle cx="1180" cy="60" r="106" stroke="#c084fc" stroke-width="2" opacity="0.5" fill="none" />

  <!-- 4. CONSTELACIONES Y ESTRELLAS (NODOS DE RED / TOPOLOGÍA) -->
  <!-- Constelación Superior Izquierda -->
  <line x1="80" y1="45" x2="140" y2="30" stroke="#a855f7" stroke-width="0.8" opacity="0.5" />
  <line x1="140" y1="30" x2="200" y2="60" stroke="#a855f7" stroke-width="0.8" opacity="0.5" />
  <line x1="200" y1="60" x2="160" y2="100" stroke="#a855f7" stroke-width="0.8" opacity="0.5" />
  <circle cx="80" cy="45" r="2" fill="#ffffff" filter="url(#soft-glow)" />
  <circle cx="140" cy="30" r="2.5" fill="#e9d5ff" filter="url(#soft-glow)" />
  <circle cx="200" cy="60" r="2" fill="#c084fc" filter="url(#soft-glow)" />
  <circle cx="160" cy="100" r="1.8" fill="#ffffff" />

  <!-- Constelación Derecha -->
  <line x1="1020" y1="170" x2="1070" y2="140" stroke="#c084fc" stroke-width="0.8" opacity="0.5" />
  <line x1="1070" y1="140" x2="1120" y2="185" stroke="#c084fc" stroke-width="0.8" opacity="0.5" />
  <circle cx="1020" cy="170" r="2.2" fill="#ffffff" filter="url(#soft-glow)" />
  <circle cx="1070" cy="140" r="2.5" fill="#f3e8ff" filter="url(#soft-glow)" />
  <circle cx="1120" cy="185" r="2" fill="#c084fc" />

  <!-- Campo de Estrellas -->
  <circle cx="95" cy="120" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="250" cy="40" r="1.5" fill="#c084fc" opacity="0.8" />
  <circle cx="310" cy="85" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="890" cy="50" r="1.4" fill="#ffffff" opacity="0.6" />
  <circle cx="940" cy="115" r="1.2" fill="#e9d5ff" opacity="0.8" />
  <circle cx="1000" cy="75" r="1.8" fill="#ffffff" filter="url(#soft-glow)" />
  <circle cx="1140" cy="130" r="1.2" fill="#ffffff" opacity="0.7" />

  <!-- 5. LÍNEAS DE LÁSER HORIZONTALES CON DESTELLOS DE LUZ -->
  <line x1="280" y1="62" x2="920" y2="62" stroke="url(#laser-line)" stroke-width="1.5" filter="url(#soft-glow)" />
  <circle cx="600" cy="62" r="3" fill="#ffffff" filter="url(#neon-glow)" />

  <!-- 6. FILOSOFÍA CENTRAL (LEMA / HOOK INGENIERIL) -->
  <text x="600" y="52" text-anchor="middle" fill="url(#headline-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5">
    La seguridad entra en el diseño,
  </text>
  <text x="600" y="94" text-anchor="middle" fill="url(#sub-headline-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="0.8" filter="url(#soft-glow)">
    no en el último sprint.
  </text>

  <!-- LÍNEA SEPARADORA SUTIL -->
  <line x1="380" y1="120" x2="820" y2="120" stroke="url(#laser-line)" stroke-width="1" opacity="0.6" />

  <!-- 7. SUBTÍTULO / ROL PROFESIONAL Y FILOSOFÍA -->
  <text x="600" y="152" text-anchor="middle" fill="#f5f3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.8">
    Juan Diego López  •  DevOps &amp; Data Platform Engineer
  </text>

  <!-- 8. CORE PILLARS & IMPACTO TÉCNICO -->
  <text x="600" y="184" text-anchor="middle" fill="#c084fc" font-family="'Fira Code', monospace, Courier" font-size="13.5" font-weight="600" letter-spacing="0.5">
    AWS • Kubernetes (Cilium eBPF) • PySpark 4.0 (+4.4B Rows) • Terraform • FinOps
  </text>

  <!-- 9. BADGE INFERIOR DISCRETO (LOCATION & AVAILABILITY) -->
  <text x="600" y="214" text-anchor="middle" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" opacity="0.9">
    ☁️ Cloud Infrastructure &amp; Resilient Data Architectures  |  Medellín, Colombia (Remoto)
  </text>
</svg>