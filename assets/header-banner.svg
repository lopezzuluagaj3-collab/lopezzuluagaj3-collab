<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo Espacial Profundo Oscuro -->
    <linearGradient id="deep-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04000a" />
      <stop offset="35%" stop-color="#090017" />
      <stop offset="50%" stop-color="#14022b" />
      <stop offset="65%" stop-color="#090017" />
      <stop offset="100%" stop-color="#04000a" />
    </linearGradient>

    <!-- Resplandor de Nebulosa Morada Cósmica Sutil (Centro) -->
    <radialGradient id="nebula-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#6b21a8" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Atmósfera del Planeta Izquierdo -->
    <radialGradient id="planet-left" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#1e0538" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#04000a" stop-opacity="1" />
    </radialGradient>

    <!-- Atmósfera del Planeta Derecho -->
    <radialGradient id="planet-right" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#6b21a8" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#1e0538" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#04000a" stop-opacity="1" />
    </radialGradient>

    <!-- Glows -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Destello Láser Neón Horizontal -->
    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0" />
      <stop offset="25%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente Texto -->
    <linearGradient id="quote-line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <linearGradient id="quote-line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- 1. FONDO ESPACIAL LIMPIO -->
  <rect width="1200" height="220" rx="12" fill="url(#deep-space)" />
  <rect width="1200" height="220" rx="12" fill="url(#nebula-center)" />

  <!-- 2. PLANETAS LATERALES (IGUAL AL DE LINKEDIN) -->
  <!-- Planeta Izquierdo -->
  <circle cx="20" cy="110" r="140" fill="url(#planet-left)" opacity="0.6" />
  <circle cx="20" cy="110" r="141" stroke="#a855f7" stroke-width="1.2" opacity="0.35" fill="none" />

  <!-- Planeta Derecho -->
  <circle cx="1180" cy="95" r="110" fill="url(#planet-right)" opacity="0.7" />
  <circle cx="1180" cy="95" r="111" stroke="#c084fc" stroke-width="1.5" opacity="0.4" fill="none" />

  <!-- 3. CONSTELACIONES MINIMALISTAS & ESTRELLAS -->
  <!-- Constelación Izquierda -->
  <line x1="160" y1="50" x2="220" y2="35" stroke="#a855f7" stroke-width="0.7" opacity="0.45" />
  <line x1="220" y1="35" x2="270" y2="70" stroke="#a855f7" stroke-width="0.7" opacity="0.45" />
  <circle cx="160" cy="50" r="2" fill="#ffffff" filter="url(#subtle-glow)" />
  <circle cx="220" cy="35" r="2.5" fill="#f3e8ff" filter="url(#subtle-glow)" />
  <circle cx="270" cy="70" r="2" fill="#c084fc" />

  <!-- Constelación Derecha -->
  <line x1="940" y1="160" x2="990" y2="130" stroke="#c084fc" stroke-width="0.7" opacity="0.45" />
  <line x1="990" y1="130" x2="1040" y2="175" stroke="#c084fc" stroke-width="0.7" opacity="0.45" />
  <circle cx="940" cy="160" r="2" fill="#ffffff" filter="url(#subtle-glow)" />
  <circle cx="990" cy="130" r="2.5" fill="#f3e8ff" filter="url(#subtle-glow)" />
  <circle cx="1040" cy="175" r="2" fill="#c084fc" />

  <!-- Estrellas y Chispas Dispersas -->
  <circle cx="110" cy="155" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="340" cy="45" r="1.4" fill="#e9d5ff" opacity="0.6" />
  <circle cx="430" cy="175" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="860" cy="35" r="1.3" fill="#ffffff" opacity="0.6" />
  <circle cx="1080" cy="85" r="1.2" fill="#c084fc" opacity="0.7" />

  <!-- 4. LÍNEAS DE LÁSER HORIZONTALES (IDÉNTICAS AL BANNER DE LINKEDIN) -->
  <line x1="320" y1="68" x2="880" y2="68" stroke="url(#laser-line)" stroke-width="1.2" filter="url(#subtle-glow)" />
  <circle cx="600" cy="68" r="2.5" fill="#ffffff" filter="url(#soft-glow)" />

  <!-- 5. FRASE PROTAGONISTA LIMPIA -->
  <text x="600" y="58" text-anchor="middle" fill="url(#quote-line1)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="0.5">
    La seguridad entra en el diseño,
  </text>
  <text x="600" y="108" text-anchor="middle" fill="url(#quote-line2)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="0.8" filter="url(#subtle-glow)">
    no en el último sprint.
  </text>

  <!-- 6. TARJETA INFERIOR DISCRETA CON DATOS TÉCNICOS (ESTILO LINKEDIN ESQUINA INFERIOR) -->
  <g transform="translate(600, 165)">
    <!-- Fila 1: Rol e Icono Cloud -->
    <text x="0" y="0" text-anchor="middle" fill="#f5f3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">
      ☁️ Cloud Infrastructure &amp; DevOps Engineer  |  Data Platforms
    </text>

    <!-- Fila 2: Stack & Ubicación -->
    <text x="0" y="24" text-anchor="middle" fill="#c084fc" font-family="'Fira Code', monospace, Courier" font-size="12.5" font-weight="500" letter-spacing="0.4">
      AWS • Terraform • Kubernetes • PySpark  |  Medellín (Remoto)
    </text>
  </g>
</svg>